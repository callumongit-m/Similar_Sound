[project]
name = "service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.1.0",
    "fastapi>=0.162.4",
    "langgraph>=1.2.20",
    "librosa>=0.11.0",
    "numpy>=1.26.4",
    "psutil>=7.2.2",
    "pyloudnorm>=0.2.0",
    "pytest>=9.2.0",
    "soundfile>=0.14.0",
    "torch>=2.6",
    "torchaudio>=2.6",
    "transformers>=5.22.2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
